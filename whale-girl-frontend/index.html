<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Whale Girl</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent; /* required for OBS transparent overlay */
    }
    #whale-canvas { display: block; }
    #whale-status {
      position: fixed;
      left: 8px;
      bottom: 8px;
      z-index: 10;
      font: 12px/1.4 -apple-system, "Helvetica Neue", Arial, sans-serif;
      color: #9adcf8;
      background: rgba(0, 0, 0, 0.55);
      padding: 4px 8px;
      border-radius: 4px;
      display: none;
      white-space: pre;
    }
  </style>
</head>
<body>
  <div id="whale-status"></div>

  <!-- Load order matters: Cubism Core -> PixiJS -> pixi-live2d-display (cubism4). -->
  <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js" defer></script>
  <script
    src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.3/dist/pixi.min.js"
    onerror="this.remove();var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.3/pixi.min.js';s.defer=true;document.head.appendChild(s);"
    defer></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js" defer></script>

  <script>
  'use strict';

  (function () {
    var query = new URLSearchParams(window.location.search);
    var DEBUG = query.get('debug') === '1';
    // Override the proxy endpoint with ?ws=ws://host:port (used later for the Ubuntu split).
    var WS_BASE = query.get('ws') || 'ws://localhost:3001';
    var MODEL_URL = 'model/whale.model3.json';

    var statusEl = document.getElementById('whale-status');

    function setStatus(text) {
      if (!DEBUG) return;
      statusEl.style.display = 'block';
      statusEl.textContent = text;
    }

    var modelInfo = ''; // set on successful model load; prefixes the ?debug=1 status line
    var fatalInfo = ''; // set once on a fatal error; stays visible in the status line
    function statusLine(wsText) {
      var head = fatalInfo || modelInfo;
      if (head && wsText) return head + ' | ' + wsText;
      return head || wsText;
    }

    var loggedFatal = false;
    function fatal(message) {
      if (loggedFatal) return; // report once: keeps the console clean in OBS
      loggedFatal = true;
      fatalInfo = message;
      console.error('[whale-girl] ' + message);
      setStatus(message);
    }

    // Boot runs on DOMContentLoaded, after all deferred CDN scripts executed.
    function boot() {
      if (!window.PIXI) return fatal('PixiJS failed to load (check network / CDN access).');
      if (!window.Live2DCubismCore) return fatal('Live2D Cubism Core failed to load.');
      if (!window.PIXI.live2d || !window.PIXI.live2d.Live2DModel) {
        return fatal('pixi-live2d-display failed to load.');
      }

      var app;
      try {
        app = new PIXI.Application({
          backgroundAlpha: 0, // fully transparent canvas for OBS
          resizeTo: window,
          antialias: true,
          autoDensity: true,
          resolution: Math.min(window.devicePixelRatio || 1, 2), // cap GPU memory on retina
          powerPreference: 'high-performance'
        });
      } catch (err) {
        return fatal('WebGL unavailable: ' + err.message);
      }
      app.view.id = 'whale-canvas';
      document.body.appendChild(app.view);

      var Live2DModel = PIXI.live2d.Live2DModel;
      // Explicit ticker registration; the UMD bundle would fall back to
      // window.PIXI.Ticker on its own, but being explicit is safer.
      if (Live2DModel.registerTicker && PIXI.Ticker) {
        try { Live2DModel.registerTicker(PIXI.Ticker); } catch (err) { /* ignore */ }
      }

      var model = null;
      var lastParams = new Map(); // latest value per parameter, applied when the model is ready

      // --- placeholder whale (shown until/unless the real model loads) ---
      function buildPlaceholder() {
        var g = new PIXI.Container();
        var shape = new PIXI.Graphics();
        shape.beginFill(0x5f9ea0, 0.9);
        shape.drawEllipse(0, 0, 150, 90);
        shape.endFill();
        shape.beginFill(0x5f9ea0, 0.9);
        shape.moveTo(-140, 0);
        shape.lineTo(-195, -65);
        shape.lineTo(-195, 65);
        shape.closePath();
        shape.endFill();
        shape.beginFill(0x1c2b33);
        shape.drawCircle(95, -25, 10);
        shape.endFill();
        var mouth = new PIXI.Graphics();
        mouth.beginFill(0x1c2b33);
        mouth.drawEllipse(55, 45, 40, 14);
        mouth.endFill();
        var label = new PIXI.Text('Whale Girl — model placeholder', {
          fontFamily: 'Arial',
          fontSize: 22,
          fill: 0xbde7f5,
          align: 'center'
        });
        label.anchor.set(0.5, 0);
        label.y = 110;
        g.addChild(shape, mouth, label);
        return g;
      }

      var placeholder = buildPlaceholder();
      app.stage.addChild(placeholder);
      fitModel();

      // --- model loading (staged errors: 404 / bad JSON / version / loader) ---
      function stageError(message) {
        var err = new Error(message);
        err.whaleStage = true;
        return err;
      }

      // Playback hooks: frontend API only for now; M3.1 will call these from
      // protocol commands instead of adding a second animation path.
      // pixi-live2d-display 0.4.0 exposes expressions through
      // internalModel.motionManager.expressionManager (not internalModel).
      function installHooks(m) {
        function motionManager() {
          return (m.internalModel && m.internalModel.motionManager) || null;
        }
        function expressionManager() {
          var mm = motionManager();
          return (mm && mm.expressionManager) || null;
        }
        function motionGroups() {
          var mm = motionManager();
          var defs = mm && mm.definitions;
          if (!defs) return [];
          return typeof defs.keys === 'function' ? Array.from(defs.keys()) : Object.keys(defs);
        }
        function expressionNames() {
          var em = expressionManager();
          var defs = em && em.definitions;
          if (!defs || !defs.length) return [];
          var names = [];
          for (var i = 0; i < defs.length; i++) {
            names.push(defs[i].Name || defs[i].name || String(i));
          }
          return names;
        }
        window.whaleModel = {
          model: m,
          // 0.4.0 rejects a new motion while one plays at the same priority
          // (returns false, never queues) — force-start so console tests work.
          playMotion: function (group, index) {
            var mm = motionManager();
            if (!mm) return Promise.resolve(false);
            var priority = (window.PIXI.live2d.MotionPriority &&
              window.PIXI.live2d.MotionPriority.FORCE) || 3;
            // Same motion is "already playing" and rejected even with FORCE:
            // stop first so playMotion always restarts it.
            if (mm.state && mm.state.currentGroup === group &&
                (index === undefined || mm.state.currentIndex === index)) {
              if (typeof mm.stopAllMotions === 'function') mm.stopAllMotions();
            }
            try { return m.motion(group, index, priority); } catch (err) { return Promise.reject(err); }
          },
          playExpression: function (name) {
            try { return m.expression(name); } catch (err) { return Promise.reject(err); }
          },
          // Stops the active motion; the idle motion resumes automatically
          // (by design — this is the model's resting state).
          stopMotion: function () {
            var mm = motionManager();
            if (mm && typeof mm.stopAllMotions === 'function') mm.stopAllMotions();
          },
          // Restores every parameter to its default value: clears leftover
          // poses/props that accumulate when motions are switched quickly.
          resetPose: function () {
            var mm = motionManager();
            if (mm && typeof mm.stopAllMotions === 'function') mm.stopAllMotions();
            var cm = m.internalModel && m.internalModel.coreModel;
            if (!cm || typeof cm.getParameterCount !== 'function') return;
            var count = cm.getParameterCount();
            for (var i = 0; i < count; i++) {
              cm.setParameterValueByIndex(i, cm.getParameterDefaultValue(i));
            }
          },
          resetExpression: function () {
            var em = expressionManager();
            if (em && typeof em.resetExpression === 'function') em.resetExpression();
          },
          listMotions: motionGroups,
          listExpressions: expressionNames
        };
      }

      function describeModel() {
        var groups = [];
        var exprs = [];
        try { groups = window.whaleModel.listMotions(); } catch (err) { /* ignore */ }
        try { exprs = window.whaleModel.listExpressions(); } catch (err) { /* ignore */ }
        return 'model: ' + MODEL_URL.split('/').pop() + ' — ' + groups.length +
          ' motion groups, ' + exprs.length + ' expressions';
      }

      function loadModel() {
        fetch(MODEL_URL)
          .then(function (res) {
            if (!res.ok) {
              throw stageError('model not found at ' + MODEL_URL + ' (HTTP ' + res.status +
                ') — drop your Cubism assets into model/ and refresh.');
            }
            return res.text();
          })
          .then(function (text) {
            var json;
            try {
              json = JSON.parse(text);
            } catch (err) {
              throw stageError('whale.model3.json is not valid JSON (' + err.message + ')');
            }
            var version = json && json.Version;
            if (typeof version === 'number' && version > 4) {
              throw stageError('Cubism ' + version + ' model is not supported by the ' +
                'Cubism 4 runtime in this frontend — re-export the asset for Cubism 4.x.');
            }
            return Live2DModel.from(MODEL_URL, { autoInteract: false, motionPreload: 'NONE' });
          })
          .then(function (m) {
            model = m;
            app.stage.removeChild(placeholder);
            app.stage.addChild(m);
            fitModel();
            flushParams();
            installHooks(m);
            modelInfo = describeModel();
            setStatus(modelInfo);
          })
          .catch(function (err) {
            var detail = err && err.message ? err.message : String(err);
            if (err && err.whaleStage) {
              fatal(detail);
            } else {
              fatal('model not loaded — Live2D loader failed: ' + detail +
                ' — check the asset files (moc3 version <= 4, textures, motions).');
            }
          });
      }
      loadModel();

      // --- fit pipeline: bottom-center, ~90% of viewport height ---
      function fitModel() {
        var target = model || placeholder;
        var w = window.innerWidth;
        var h = window.innerHeight;
        if (!w || !h) return;
        var bounds = target.getLocalBounds();
        var bw = bounds.width || 300;
        var bh = bounds.height || 200;
        var scale = Math.min((h * 0.9) / bh, (w * 0.6) / bw);
        target.scale.set(scale);
        if (target.anchor) {
          target.anchor.set(0.5, 1);
        } else {
          // PIXI.Container (the placeholder) has no anchor: pin the bounds'
          // bottom-center to the viewport bottom with pivot instead.
          target.pivot.set(bounds.x + bw / 2, bounds.y + bh);
        }
        target.x = w / 2;
        target.y = h;
      }
      window.addEventListener('resize', fitModel);

      function flushParams() {
        if (!model || !model.internalModel || !model.internalModel.coreModel) return;
        var core = model.internalModel.coreModel;
        lastParams.forEach(function (value, id) {
          core.setParameterValueById(id, value);
        });
      }

      // --- websocket (auto-reconnect with capped backoff + jitter) ---
      var ws = null;
      var wsRetry = 0;
      var wsTimer = null;

      function connectWS() {
        ws = new WebSocket(WS_BASE + '?role=web');
        ws.onopen = function () {
          wsRetry = 0;
          ws.send('{"type":"hello"}');
          setStatus(statusLine('ws connected'));
        };
        ws.onmessage = function (evt) {
          var msg;
          try {
            msg = JSON.parse(evt.data);
          } catch (err) {
            return; // ignore malformed frames, never crash the page
          }
          if (!msg || msg.type !== 'motion' || !msg.p) return;

          if (model && model.internalModel && model.internalModel.coreModel) {
            var core = model.internalModel.coreModel;
            for (var id in msg.p) {
              var value = msg.p[id];
              lastParams.set(id, value);
              core.setParameterValueById(id, value);
            }
          } else {
            for (var id in msg.p) lastParams.set(id, msg.p[id]);
          }
          if (DEBUG) setStatus(statusLine('ws connected, frame ' + msg.f));
        };
        ws.onclose = function () {
          setStatus(statusLine('ws disconnected, retrying...'));
          scheduleReconnect();
        };
        ws.onerror = function () {
          try { ws.close(); } catch (err) { /* ignore */ }
        };
      }

      function scheduleReconnect() {
        if (wsTimer) return;
        var delay = Math.min(1000 * Math.pow(2, wsRetry++), 10000) + Math.random() * 250;
        wsTimer = setTimeout(function () {
          wsTimer = null;
          connectWS();
        }, delay);
      }

      connectWS();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }
  })();
  </script>
</body>
</html>
