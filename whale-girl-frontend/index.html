<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Whale Girl</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent; /* required for OBS transparent overlay */
    }
    #whale-canvas { display: block; }
    #whale-status {
      position: fixed;
      left: 8px;
      bottom: 8px;
      z-index: 10;
      font: 12px/1.4 -apple-system, "Helvetica Neue", Arial, sans-serif;
      color: #9adcf8;
      background: rgba(0, 0, 0, 0.55);
      padding: 4px 8px;
      border-radius: 4px;
      display: none;
      white-space: pre;
    }
    /* M2.2: shown only while the browser blocks audio without a gesture. */
    #whale-pill {
      position: fixed;
      right: 8px;
      bottom: 8px;
      z-index: 11;
      font: 12px/1.4 -apple-system, "Helvetica Neue", Arial, sans-serif;
      color: #0b2530;
      background: #9adcf8;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      display: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="whale-status"></div>

  <!-- Load order matters: Cubism Core -> PixiJS -> pixi-live2d-display (cubism4). -->
  <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js" defer></script>
  <script
    src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.3/dist/pixi.min.js"
    onerror="this.remove();var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.3/pixi.min.js';s.defer=true;document.head.appendChild(s);"
    defer></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js" defer></script>

  <script>
  'use strict';

  (function () {
    var query = new URLSearchParams(window.location.search);
    var DEBUG = query.get('debug') === '1';
    // Override the proxy endpoint with ?ws=ws://host:port (used later for the Ubuntu split).
    var WS_BASE = query.get('ws') || 'ws://localhost:3001';
    var MODEL_URL = 'model/whale.model3.json';

    var statusEl = document.getElementById('whale-status');

    function setStatus(text) {
      if (!DEBUG) return;
      statusEl.style.display = 'block';
      statusEl.textContent = text;
    }

    var modelInfo = ''; // set on successful model load; prefixes the ?debug=1 status line
    var fatalInfo = ''; // set once on a fatal error; stays visible in the status line
    function statusLine(wsText) {
      var head = fatalInfo || modelInfo;
      if (head && wsText) return head + ' | ' + wsText;
      return head || wsText;
    }

    var loggedFatal = false;
    function fatal(message) {
      if (loggedFatal) return; // report once: keeps the console clean in OBS
      loggedFatal = true;
      fatalInfo = message;
      console.error('[whale-girl] ' + message);
      setStatus(message);
    }

    // Boot runs on DOMContentLoaded, after all deferred CDN scripts executed.
    function boot() {
      if (!window.PIXI) return fatal('PixiJS failed to load (check network / CDN access).');
      if (!window.Live2DCubismCore) return fatal('Live2D Cubism Core failed to load.');
      if (!window.PIXI.live2d || !window.PIXI.live2d.Live2DModel) {
        return fatal('pixi-live2d-display failed to load.');
      }

      var app;
      try {
        app = new PIXI.Application({
          backgroundAlpha: 0, // fully transparent canvas for OBS
          resizeTo: window,
          antialias: true,
          autoDensity: true,
          resolution: Math.min(window.devicePixelRatio || 1, 2), // cap GPU memory on retina
          powerPreference: 'high-performance'
        });
      } catch (err) {
        return fatal('WebGL unavailable: ' + err.message);
      }
      app.view.id = 'whale-canvas';
      document.body.appendChild(app.view);

      var Live2DModel = PIXI.live2d.Live2DModel;
      // Explicit ticker registration; the UMD bundle would fall back to
      // window.PIXI.Ticker on its own, but being explicit is safer.
      if (Live2DModel.registerTicker && PIXI.Ticker) {
        try { Live2DModel.registerTicker(PIXI.Ticker); } catch (err) { /* ignore */ }
      }

      var model = null;
      var lastParams = new Map(); // latest value per parameter, applied when the model is ready
      var frameP = null;          // the frame being applied (for the reset below)
      var frameCore = null;       // its core model

      // A parameter that stops appearing in the frames was a pose-overlay key:
      // restore its default so a cleared pose really leaves the model too.
      // Allocation-free: one shared callback, a Map forEach and no objects.
      function resetGoneParam(value, id) {
        if (!frameP || Object.prototype.hasOwnProperty.call(frameP, id)) return;
        if (id === 'ParamMouthOpenY' && sayActive) return;
        lastParams.delete(id);
        if (!frameCore
            || typeof frameCore.getParameterIndex !== 'function'
            || typeof frameCore.getParameterDefaultValue !== 'function') return;
        try {
          var index = frameCore.getParameterIndex(id);
          if (index >= 0) {
            frameCore.setParameterValueById(id, frameCore.getParameterDefaultValue(index));
          }
        } catch (err) { /* older bundle: leave the value */ }
      }

      // --- placeholder whale (shown until/unless the real model loads) ---
      function buildPlaceholder() {
        var g = new PIXI.Container();
        var shape = new PIXI.Graphics();
        shape.beginFill(0x5f9ea0, 0.9);
        shape.drawEllipse(0, 0, 150, 90);
        shape.endFill();
        shape.beginFill(0x5f9ea0, 0.9);
        shape.moveTo(-140, 0);
        shape.lineTo(-195, -65);
        shape.lineTo(-195, 65);
        shape.closePath();
        shape.endFill();
        shape.beginFill(0x1c2b33);
        shape.drawCircle(95, -25, 10);
        shape.endFill();
        var mouth = new PIXI.Graphics();
        mouth.beginFill(0x1c2b33);
        mouth.drawEllipse(55, 45, 40, 14);
        mouth.endFill();
        var label = new PIXI.Text('Whale Girl — model placeholder', {
          fontFamily: 'Arial',
          fontSize: 22,
          fill: 0xbde7f5,
          align: 'center'
        });
        label.anchor.set(0.5, 0);
        label.y = 110;
        g.addChild(shape, mouth, label);
        return g;
      }

      var placeholder = buildPlaceholder();
      app.stage.addChild(placeholder);
      fitModel();

      // --- model loading (staged errors: 404 / bad JSON / version / loader) ---
      function stageError(message) {
        var err = new Error(message);
        err.whaleStage = true;
        return err;
      }

      // Playback hooks: the v1 command surface (M3.1) calls these from
      // protocol commands; they are also available from the console.
      // pixi-live2d-display 0.4.0 exposes expressions through
      // internalModel.motionManager.expressionManager (not internalModel).
      function installHooks(m) {
        function motionManager() {
          return (m.internalModel && m.internalModel.motionManager) || null;
        }
        function expressionManager() {
          var mm = motionManager();
          return (mm && mm.expressionManager) || null;
        }
        function motionGroups() {
          var mm = motionManager();
          var defs = mm && mm.definitions;
          if (!defs) return [];
          return typeof defs.keys === 'function' ? Array.from(defs.keys()) : Object.keys(defs);
        }
        function expressionNames() {
          var em = expressionManager();
          var defs = em && em.definitions;
          if (!defs || !defs.length) return [];
          var names = [];
          for (var i = 0; i < defs.length; i++) {
            names.push(defs[i].Name || defs[i].name || String(i));
          }
          return names;
        }
        window.whaleModel = {
          model: m,
          // v1 (M3.1): last command + outcome, for ?debug=1 and the probes.
          cmdState: cmdState,
          // 0.4.0 rejects a new motion while one plays at the same priority
          // (returns false, never queues) — force-start so console tests work.
          playMotion: function (group, index) {
            var mm = motionManager();
            if (!mm) return Promise.resolve(false);
            var priority = (window.PIXI.live2d.MotionPriority &&
              window.PIXI.live2d.MotionPriority.FORCE) || 3;
            // Same motion is "already playing" and rejected even with FORCE:
            // stop first so playMotion always restarts it.
            if (mm.state && mm.state.currentGroup === group &&
                (index === undefined || mm.state.currentIndex === index)) {
              if (typeof mm.stopAllMotions === 'function') mm.stopAllMotions();
            }
            try { return m.motion(group, index, priority); } catch (err) { return Promise.reject(err); }
          },
          playExpression: function (name) {
            try { return m.expression(name); } catch (err) { return Promise.reject(err); }
          },
          // Stops the active motion; the idle motion resumes automatically
          // (by design — this is the model's resting state).
          stopMotion: function () {
            var mm = motionManager();
            if (mm && typeof mm.stopAllMotions === 'function') mm.stopAllMotions();
          },
          // Restores every parameter to its default value: clears leftover
          // poses/props that accumulate when motions are switched quickly.
          resetPose: function () {
            var mm = motionManager();
            if (mm && typeof mm.stopAllMotions === 'function') mm.stopAllMotions();
            var cm = m.internalModel && m.internalModel.coreModel;
            if (!cm || typeof cm.getParameterCount !== 'function') return;
            var count = cm.getParameterCount();
            for (var i = 0; i < count; i++) {
              cm.setParameterValueByIndex(i, cm.getParameterDefaultValue(i));
            }
          },
          resetExpression: function () {
            var em = expressionManager();
            if (em && typeof em.resetExpression === 'function') em.resetExpression();
          },
          listMotions: motionGroups,
          listExpressions: expressionNames
        };
      }

      function describeModel() {
        var groups = [];
        var exprs = [];
        try { groups = window.whaleModel.listMotions(); } catch (err) { /* ignore */ }
        try { exprs = window.whaleModel.listExpressions(); } catch (err) { /* ignore */ }
        return 'model: ' + MODEL_URL.split('/').pop() + ' — ' + groups.length +
          ' motion groups, ' + exprs.length + ' expressions';
      }

      function collectFileRefs(json) {
        var refs = json && json.FileReferences;
        var files = [];
        if (!refs) return files;
        if (typeof refs.Moc === 'string') files.push(refs.Moc);
        if (Array.isArray(refs.Textures)) {
          for (var i = 0; i < refs.Textures.length; i++) files.push(refs.Textures[i]);
        }
        if (typeof refs.Physics === 'string') files.push(refs.Physics);
        if (typeof refs.DisplayInfo === 'string') files.push(refs.DisplayInfo);
        if (refs.Motions && typeof refs.Motions === 'object') {
          for (var g in refs.Motions) {
            var list = refs.Motions[g];
            if (!Array.isArray(list)) continue;
            for (var k = 0; k < list.length; k++) {
              if (list[k] && typeof list[k].File === 'string') files.push(list[k].File);
            }
          }
        }
        if (Array.isArray(refs.Expressions)) {
          for (var e = 0; e < refs.Expressions.length; e++) {
            if (refs.Expressions[e] && typeof refs.Expressions[e].File === 'string') {
              files.push(refs.Expressions[e].File);
            }
          }
        }
        return files;
      }

      // Runs only after a loader failure: HEAD every referenced file so the
      // error names the missing one instead of "Network error".
      function diagnoseMissingFiles(json) {
        var files = collectFileRefs(json);
        if (!files.length) return Promise.resolve({ missing: [], unreachable: 0 });
        var base = new URL(MODEL_URL, window.location.href);
        var jobs = [];
        for (var i = 0; i < files.length; i++) {
          jobs.push((function (rel) {
            return fetch(new URL(rel, base).href, { method: 'HEAD' }).then(
              function (res) {
                // A definite HTTP answer: 200 = present, anything else = missing.
                return res.ok ? null : rel;
              },
              function () {
                // No HTTP answer at all (server down / blocked): not evidence
                // of a missing file — report the check as incomplete instead.
                return { unreachable: true };
              }
            );
          })(files[i]));
        }
        return Promise.all(jobs).then(function (results) {
          var missing = [];
          var unreachable = 0;
          for (var j = 0; j < results.length; j++) {
            if (results[j] === null) continue;
            if (results[j] && results[j].unreachable) { unreachable++; continue; }
            missing.push(results[j]);
          }
          return { missing: missing, unreachable: unreachable };
        });
      }

      function loadModel() {
        var settingsJson = null;
        fetch(MODEL_URL)
          .then(function (res) {
            if (!res.ok) {
              throw stageError('model not found at ' + MODEL_URL + ' (HTTP ' + res.status +
                ') — drop your Cubism assets into model/ and refresh.');
            }
            return res.text();
          })
          .then(function (text) {
            var json;
            try {
              json = JSON.parse(text);
            } catch (err) {
              throw stageError('whale.model3.json is not valid JSON (' + err.message + ')');
            }
            var version = json && json.Version;
            if (typeof version === 'number' && version > 4) {
              throw stageError('Cubism ' + version + ' model is not supported by the ' +
                'Cubism 4 runtime in this frontend — re-export the asset for Cubism 4.x.');
            }
            // Hand the parsed settings to the loader with an explicit url: one
            // fetch of whale.model3.json, and FileReferences still resolve
            // relative to the settings file's directory.
            json.url = new URL(MODEL_URL, window.location.href).href;
            settingsJson = json;
            return Live2DModel.from(json, { autoInteract: false, motionPreload: 'NONE' });
          })
          .then(function (m) {
            model = m;
            app.stage.removeChild(placeholder);
            app.stage.addChild(m);
            fitModel();
            flushParams();
            installHooks(m);
            modelInfo = describeModel();
            setStatus(modelInfo);
          })
          .catch(function (err) {
            var detail = err && err.message ? err.message : String(err);
            if (err && err.whaleStage) {
              fatal(detail);
              return;
            }
            // Loader messages may already end with punctuation ("Network error.");
            // strip trailing punctuation so the diagnostic suffix never doubles it.
            var cleanDetail = detail.replace(/[.!?\s]+$/, '');
            diagnoseMissingFiles(settingsJson).then(function (diag) {
              if (diag.unreachable) {
                fatal('model not loaded — ' + cleanDetail + '. Asset check incomplete: ' +
                  diag.unreachable + ' request(s) failed at the network level' +
                  (diag.missing.length ? '; missing file(s): ' + diag.missing.join(', ') : '') +
                  ' — retry when the server is reachable.');
              } else if (diag.missing.length) {
                fatal('model not loaded — missing file(s): ' + diag.missing.join(', ') +
                  ' — check whale-girl-frontend/model/README.md.');
              } else {
                fatal('model not loaded — Live2D loader failed: ' + cleanDetail +
                  ' — check the asset files (moc3 version <= 4, textures, motions).');
              }
            });
          });
      }
      loadModel();

      // --- fit pipeline: bottom-center, ~90% of viewport height ---
      function fitModel() {
        var target = model || placeholder;
        var w = window.innerWidth;
        var h = window.innerHeight;
        if (!w || !h) return;
        var bounds = target.getLocalBounds();
        var bw = bounds.width || 300;
        var bh = bounds.height || 200;
        var scale = Math.min((h * 0.9) / bh, (w * 0.6) / bw);
        target.scale.set(scale);
        if (target.anchor) {
          target.anchor.set(0.5, 1);
        } else {
          // PIXI.Container (the placeholder) has no anchor: pin the bounds'
          // bottom-center to the viewport bottom with pivot instead.
          target.pivot.set(bounds.x + bw / 2, bounds.y + bh);
        }
        target.x = w / 2;
        target.y = h;
      }
      window.addEventListener('resize', fitModel);

      function flushParams() {
        if (!model || !model.internalModel || !model.internalModel.coreModel) return;
        var core = model.internalModel.coreModel;
        lastParams.forEach(function (value, id) {
          core.setParameterValueById(id, value);
        });
      }

      // --- M2.2 speech: TTS playback + word-timeline mouth -------------------
      // A say frame wins over the motion-frame mouth (priority rule); the mock
      // envelope resumes the moment no say is active. Zero per-frame
      // allocations: one envelope number + a preallocated probe ring.
      var audioCtx = null;
      var saySource = null;
      var sayActive = null;
      var pillEl = null;
      var mouthValue = 0.0;
      var lastMouthAt = 0;
      var MOUTH_ATTACK = 0.020;   // seconds
      var MOUTH_RELEASE = 0.120;  // seconds
      var AMP_WIN = 0.05;         // amplitude-envelope window (say fallback)
      var probeT = new Float32Array(4096);
      var probeM = new Float32Array(4096);
      var probeN = 0;
      var lastSay = null;
      var sayErrorLogged = false;
      var sayGen = 0; // newest say wins even if an older decode resolves later
      var sayStarts = 0; // playback starts (probe evidence for the decode guard)
      var pendingCmdSay = false; // a commanded say is decoding (mock must wait)

      function sayAsyncError(message) {
        if (!sayErrorLogged) {
          sayErrorLogged = true;
          console.error('[whale-girl] ' + message); // once, keeps OBS console clean
        }
        if (DEBUG) setStatus(statusLine('say: ' + message));
      }

      function showPill() {
        if (!pillEl) {
          pillEl = document.createElement('div');
          pillEl.id = 'whale-pill';
          pillEl.textContent = 'click to enable audio';
          pillEl.addEventListener('click', function () {
            ensureAudio(); // inside a gesture: the context is allowed to resume
            hidePill();
          });
          document.body.appendChild(pillEl);
        }
        pillEl.style.display = 'block';
      }

      function hidePill() {
        if (pillEl) pillEl.style.display = 'none';
      }

      // Creates/resumes the AudioContext. Returns it synchronously so the say
      // path never depends on a resume() promise that may stay pending under
      // an autoplay policy (OBS): playback then starts when the gesture comes.
      function ensureAudio() {
        if (!audioCtx) {
          var Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) throw new Error('Web Audio unavailable');
          audioCtx = new Ctx();
        }
        if (audioCtx.state !== 'running') {
          var resumed = audioCtx.resume();
          if (resumed && typeof resumed.then === 'function') {
            resumed.then(function () {
              if (audioCtx && audioCtx.state === 'running') hidePill();
            }, function () { /* gesture still needed — pill stays visible */ });
          }
        }
        return audioCtx;
      }

      window.addEventListener('pointerdown', function () {
        if (audioCtx && audioCtx.state !== 'running') ensureAudio();
      });
      window.addEventListener('keydown', function () {
        if (audioCtx && audioCtx.state !== 'running') ensureAudio();
      });

      function stopSay() {
        if (!saySource) return;
        try { saySource.onended = null; } catch (err) { /* ignore */ }
        try { saySource.stop(); } catch (err) { /* ignore */ }
        try { saySource.disconnect(); } catch (err) { /* ignore */ }
        saySource = null;
      }

      // RMS per ~50 ms window, linearly normalized to 0..1 — the amplitude
      // fallback for timestamp-less engines (macOS say). Allocated once per
      // utterance at decode time, reused per frame.
      function buildAmp(buffer) {
        var win = Math.max(1, Math.round(buffer.sampleRate * AMP_WIN));
        var n = Math.max(1, Math.ceil(buffer.duration / AMP_WIN));
        var amp = new Float32Array(n);
        var chans = [];
        var c;
        for (c = 0; c < buffer.numberOfChannels; c++) chans.push(buffer.getChannelData(c));
        var peak = 0.0001;
        var w, a, b, s, v, sum, cnt, rms;
        for (w = 0; w < n; w++) {
          a = w * win;
          b = Math.min(a + win, buffer.length);
          sum = 0;
          cnt = b - a;
          for (s = a; s < b; s++) {
            v = 0;
            for (c = 0; c < chans.length; c++) v += chans[c][s];
            v /= chans.length;
            sum += v * v;
          }
          rms = cnt > 0 ? Math.sqrt(sum / cnt) : 0;
          amp[w] = rms;
          if (rms > peak) peak = rms;
        }
        for (w = 0; w < n; w++) amp[w] = Math.min(1, amp[w] / peak);
        return amp;
      }

      function handleSay(msg, delayMs) {
        var url = msg && msg.audio;
        if (typeof url !== 'string') return;
        // M3.1: a mock (canned) line never interrupts a playing line and is
        // never allowed to start in live mode; a commanded say keeps latest-wins.
        if (msg.src === 'mock'
            && (sayActive || cmdState.mode === 'live' || pendingCmdSay)) return;
        var words = Array.isArray(msg.words) ? msg.words : [];
        var engine = /\.m4a(\?|$)/i.test(url) ? 'say' : 'edge-tts';
        var gen = ++sayGen;
        pendingCmdSay = msg.src !== 'mock';
        var ctx;
        try {
          ctx = ensureAudio();
        } catch (err) {
          pendingCmdSay = false;
          sayAsyncError('audio unavailable: ' + (err && err.message ? err.message : err));
          return;
        }
        // The fetch/decode chain is a function so the probe can delay it and
        // prove the decode-time guard (delayMs is test-only; frames never pass it).
        var play = function () {
          fetch(url).then(function (res) {
            if (!res.ok) throw new Error('audio HTTP ' + res.status);
            return res.arrayBuffer();
          }).then(function (buf) {
            return ctx.decodeAudioData(buf);
          }).then(function (buffer) {
          // Latest-wins guard: a newer say arrived while this one decoded, so
          // drop this (now stale) buffer instead of replacing the new say.
          if (gen !== sayGen) return;
          pendingCmdSay = false;
          // A mock line that decoded after a live flip must not start either.
          if (msg.src === 'mock' && cmdState.mode === 'live') return;
          stopSay(); // latest wins: a new say replaces the current playback
          sayActive = {
            words: words,
            startCtx: ctx.currentTime + 0.03,
            duration: buffer.duration,
            engine: engine,
            bufferBytes: buffer.length * buffer.numberOfChannels * 4,
            amp: words.length ? null : buildAmp(buffer),
            wordCursor: 0,
            label: words.length ? words[0][2] : '…',
            audioUrl: url,
            src: msg.src === 'mock' ? 'mock' : 'cmd'
          };
          lastSay = sayActive;
          probeN = 0;
          mouthValue = 0;
          lastMouthAt = ctx.currentTime - 1 / 60;
          var src = ctx.createBufferSource();
          src.buffer = buffer;
          src.connect(ctx.destination);
          src.onended = function () {
            if (saySource === src) saySource = null;
          };
          saySource = src;
          sayStarts++;
          src.start(sayActive.startCtx);
          if (ctx.state === 'running') {
            hidePill();
            if (DEBUG) {
              setStatus(statusLine('say: ' + sayActive.label + ' | mouth 0.00 | ' + engine));
            }
          } else {
            // OBS/browser autoplay policy: the source is scheduled; it starts
            // as soon as one gesture resumes the context.
            showPill();
            if (DEBUG) setStatus(statusLine('audio: suspended — click the pill to enable'));
          }
          }).catch(function (err) {
            if (gen === sayGen) pendingCmdSay = false;
            sayAsyncError('decode failed: ' + (err && err.message ? err.message : err));
          });
        };
        if (delayMs > 0) {
          setTimeout(play, delayMs);
        } else {
          play();
        }
      }

      // Called once per motion frame while a say is active: word envelope (or
      // amplitude envelope) -> attack/release smoother -> ParamMouthOpenY.
      function applyMouth(core) {
        if (!sayActive) return;
        var now = audioCtx ? audioCtx.currentTime : 0;
        var t = now - sayActive.startCtx;
        var target = 0;
        if (t >= 0 && t <= sayActive.duration) {
          if (sayActive.words.length) {
            var list = sayActive.words;
            var w = sayActive.wordCursor;
            while (w < list.length && t > list[w][1]) w++;
            sayActive.wordCursor = w;
            if (w < list.length && t >= list[w][0]) {
              target = 1;
              if (DEBUG) sayActive.label = list[w][2];
            }
          } else if (sayActive.amp) {
            var idx = Math.min(sayActive.amp.length - 1, Math.floor(t / AMP_WIN));
            target = sayActive.amp[idx];
            if (target < 0.04) target = 0; // noise floor
          }
        }
        var dt = now - lastMouthAt;
        if (dt <= 0 || dt > 0.25) dt = 1 / 60;
        lastMouthAt = now;
        var tau = target > mouthValue ? MOUTH_ATTACK : MOUTH_RELEASE;
        mouthValue += (target - mouthValue) * (1 - Math.exp(-dt / tau));
        if (mouthValue < 0) mouthValue = 0;
        if (mouthValue > 1) mouthValue = 1;
        if (core) core.setParameterValueById('ParamMouthOpenY', mouthValue);
        if (probeN < probeT.length) {
          probeT[probeN] = t;
          probeM[probeN] = mouthValue;
          probeN++;
        }
        if (t > sayActive.duration + 0.25) {
          stopSay();
          sayActive = null;
          if (DEBUG) setStatus(statusLine('say: idle'));
        }
      }

      // Console hooks (same style as window.whaleModel). testSay injects a
      // say frame locally so the probe can assert the mock-ignore rule.
      window.whaleSpeech = {
        testSay: function (msg, delayMs) { handleSay(msg, delayMs); },
        state: function () {
          return {
            active: !!sayActive,
            engine: sayActive ? sayActive.engine : (lastSay ? lastSay.engine : null),
            word: sayActive ? sayActive.label : null,
            mouth: mouthValue,
            bufferBytes: sayActive ? sayActive.bufferBytes : (lastSay ? lastSay.bufferBytes : 0),
            duration: sayActive ? sayActive.duration : (lastSay ? lastSay.duration : 0),
            words: lastSay ? lastSay.words.length : 0,
            samples: probeN,
            starts: sayStarts,
            ctxState: audioCtx ? audioCtx.state : 'none',
            wsState: ws ? ws.readyState : -1
          };
        },
        // Probe hook: the per-frame sample ring + the last say's words timeline.
        probeStats: function () {
          var ts = new Array(probeN);
          var ms = new Array(probeN);
          for (var i = 0; i < probeN; i++) {
            ts[i] = probeT[i];
            ms[i] = probeM[i];
          }
          return {
            t: ts,
            mouth: ms,
            say: lastSay ? {
              audio: lastSay.audioUrl,
              engine: lastSay.engine,
              words: lastSay.words,
              duration: lastSay.duration,
              bufferBytes: lastSay.bufferBytes,
              amp: lastSay.amp ? Array.from(lastSay.amp) : null
            } : null
          };
        }
      };

      // --- v1 command surface (M3.1) ---------------------------------------
      // DSH sessions send motion / expression / say / pose / mode commands
      // through the server relay. The frontend executes motion/expression on
      // the M2.1 hooks; pose and mode are executed driver-side (pose values
      // arrive inside motion frames, a mode frame resets leftover poses).
      // Commands are rare events — nothing here runs per frame.
      var cmdState = { last: '', ok: null, mode: null }; // null = pending / unknown

      function cmdFailed(what, detail) {
        cmdState.ok = false;
        console.error('[whale] ' + what + ' failed: ' + detail);
      }

      function motionListText() {
        var list = [];
        try { list = window.whaleModel.listMotions(); } catch (err) { /* ignore */ }
        return list.join(', ');
      }

      function runMotionCommand(msg) {
        var group = String(msg.group);
        var index = (typeof msg.index === 'number') ? msg.index : undefined;
        cmdState.last = 'motion: ' + group + (index !== undefined ? '/' + index : '');
        cmdState.ok = null; // pending: resolves to true/false below
        if (!window.whaleModel) {
          cmdFailed('motion ' + group, 'no model loaded');
          return;
        }
        var res;
        try {
          res = window.whaleModel.playMotion(group, index);
        } catch (err) {
          cmdFailed('motion ' + group,
            ((err && err.message) || String(err)) + ' — motions: ' + motionListText());
          return;
        }
        Promise.resolve(res).then(function (ok) {
          cmdState.ok = !!ok;
          if (!ok) cmdFailed('motion ' + group, 'not started — motions: ' + motionListText());
        }, function (err) {
          var why = (err && err.message) || String(err);
          cmdFailed('motion ' + group, why + ' — motions: ' + motionListText());
        });
      }

      function runExpressionCommand(msg) {
        var name = String(msg.name);
        cmdState.last = 'expression: ' + name;
        cmdState.ok = null; // pending: resolves to true/false below
        if (!window.whaleModel) {
          cmdFailed('expression ' + name, 'no model loaded');
          return;
        }
        var res;
        var expressionList = function () {
          var list = [];
          try { list = window.whaleModel.listExpressions(); } catch (e) { /* ignore */ }
          return list.join(', ');
        };
        try {
          res = window.whaleModel.playExpression(name);
        } catch (err) {
          cmdFailed('expression ' + name,
            ((err && err.message) || String(err)) + ' — expressions: ' + expressionList());
          return;
        }
        Promise.resolve(res).then(function (ok) {
          cmdState.ok = !!ok;
          if (!ok) {
            cmdFailed('expression ' + name, 'not applied — expressions: ' + expressionList());
          }
        }, function (err) {
          cmdFailed('expression ' + name,
            ((err && err.message) || String(err)) + ' — expressions: ' + expressionList());
        });
      }

      function runModeCommand(msg) {
        if (typeof msg.mock !== 'boolean') return; // never guess a mode
        var next = msg.mock ? 'mock' : 'live';
        // A repeated mode (e.g. an idempotent 'mode live' from an AI) must not
        // wipe a held pose; only a real switch resets the model.
        if (next === cmdState.mode) return;
        cmdState.mode = next;
        cmdState.last = 'mode: ' + cmdState.mode;
        cmdState.ok = true;
        if (next === 'live' && sayActive && sayActive.src === 'mock') {
          // live mode must be silent at once: stop a playing canned line;
          // a commanded line keeps playing.
          stopSay();
          sayActive = null;
        }
        if (window.whaleModel) {
          try { window.whaleModel.resetPose(); } catch (err) { /* ignore */ }
        }
      }

      // --- websocket (auto-reconnect with capped backoff + jitter) ---
      var ws = null;
      var wsRetry = 0;
      var wsTimer = null;

      function connectWS() {
        ws = new WebSocket(WS_BASE + '?role=web');
        ws.onopen = function () {
          wsRetry = 0;
          ws.send('{"type":"hello"}');
          setStatus(statusLine('ws connected'));
        };
        ws.onmessage = function (evt) {
          var msg;
          try {
            msg = JSON.parse(evt.data);
          } catch (err) {
            return; // ignore malformed frames, never crash the page
          }
          if (!msg) return;
          if (msg.type === 'say') {
            handleSay(msg);
            return;
          }
          if (msg.type === 'motion' && msg.group) {
            runMotionCommand(msg);
            return;
          }
          if (msg.type === 'expression' && msg.name) {
            runExpressionCommand(msg);
            return;
          }
          if (msg.type === 'mode') {
            runModeCommand(msg);
            return;
          }
          if (msg.type !== 'motion' || !msg.p) return;

          if (model && model.internalModel && model.internalModel.coreModel) {
            var core = model.internalModel.coreModel;
            for (var id in msg.p) {
              // Priority rule (M2.2): a live say drives the mouth; the mock
              // motion-frame mouth applies only while no say is active.
              if (id === 'ParamMouthOpenY' && sayActive) continue;
              var value = msg.p[id];
              lastParams.set(id, value);
              core.setParameterValueById(id, value);
            }
            frameP = msg.p;
            frameCore = core;
            lastParams.forEach(resetGoneParam);
            if (sayActive) applyMouth(core);
          } else {
            for (var id2 in msg.p) lastParams.set(id2, msg.p[id2]);
          }
          if (DEBUG) {
            if (sayActive) {
              setStatus(statusLine('say: ' + sayActive.label + ' | mouth ' +
                mouthValue.toFixed(2) + ' | ' + sayActive.engine +
                ' | mode: ' + (cmdState.mode || 'unknown')));
            } else {
              setStatus(statusLine('ws connected, frame ' + msg.f +
                ' | mode: ' + (cmdState.mode || 'unknown') +
                (cmdState.last ? ' | cmd ' + cmdState.last : '')));
            }
          }
        };
        ws.onclose = function (evt) {
          // Surface the close code: 1008 = origin guard, 1006 = network.
          setStatus(statusLine('ws disconnected (' +
            (evt && typeof evt.code === 'number' ? evt.code : '?') +
            '), retrying...'));
          scheduleReconnect();
        };
        ws.onerror = function () {
          try { ws.close(); } catch (err) { /* ignore */ }
        };
      }

      function scheduleReconnect() {
        if (wsTimer) return;
        var delay = Math.min(1000 * Math.pow(2, wsRetry++), 10000) + Math.random() * 250;
        wsTimer = setTimeout(function () {
          wsTimer = null;
          connectWS();
        }, delay);
      }

      connectWS();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }
  })();
  </script>
</body>
</html>
